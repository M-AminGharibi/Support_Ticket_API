spring:
  application:
    name: support-ticket

  datasource:
    url: jdbc:postgresql://localhost:5432/support_ticket?createDatabaseIfNotExist=true
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true


springdoc:
  swagger-ui:
    path: /swagger-ui.html
